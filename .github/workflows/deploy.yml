name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'
          cache: npm

      - run: npm ci

      # Runs as part of `npm run build`, but calling it first makes a locale
      # drift show up as its own failed step rather than buried in build output.
      - run: npm run check:locales

      - run: npm run build

      # Also runs inside `npm run build`; kept explicit so a failure here reads
      # as "the built page is wrong" rather than "the build broke".
      - run: npm run check:build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  deploy:
    # Publishes to the gh-pages branch, which is what GitHub Pages already
    # serves for this repository. No third-party action involved.
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Push to gh-pages
        run: |
          set -euo pipefail
          touch dist/.nojekyll
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
